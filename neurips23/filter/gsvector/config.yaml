any:
  gsvector-filter-standard8:
    docker-tag: vector-competition/gsvector-benchmark:yfcc-standard8-experimental
    module: benchmark.algorithms.pg_filtered
    constructor: PGFilteredANN
    base-args: ["@metric"]
    run-groups:
      baseline:
        args: |
          [{"R":32,"L":100,"build_threads":8,"batch_rows":4096}]
        query-args: |
          [{"threads":8,"search_l":200,"initial_candidates":256,"max_candidates":8192,"exact_cutoff":2048,"fused_exact_probe":false}]
  gsvector-filter-codeoff-ab:
    # Experimental native replay: rebuild the image before using Docker.
    # Hold graph R/L and ANN budgets fixed; change layout and probe separately.
    docker-tag: vector-competition/gsvector-benchmark:yfcc-probe-experimental
    module: benchmark.algorithms.pg_filtered
    constructor: PGFilteredANN
    base-args: ["@metric"]
    run-groups:
      bounded-memory:
        args: |
          [{"R":32,"L":100,"build_threads":4,"batch_rows":4096,"build_neighbor_codes":false}]
        query-args: |
          [{"threads":4,"search_l":200,"initial_candidates":256,"max_candidates":8192,"exact_cutoff":2048,"fused_exact_probe":false},
           {"threads":4,"search_l":200,"initial_candidates":256,"max_candidates":8192,"exact_cutoff":2048,"fused_exact_probe":true},
           {"threads":8,"search_l":200,"initial_candidates":256,"max_candidates":8192,"exact_cutoff":2048,"fused_exact_probe":false},
           {"threads":8,"search_l":200,"initial_candidates":256,"max_candidates":8192,"exact_cutoff":2048,"fused_exact_probe":true}]
  gsvector-filter:
    docker-tag: vector-competition/gsvector-benchmark:release-20261026
    module: benchmark.algorithms.pg_filtered
    constructor: PGFilteredANN
    base-args: ["@metric"]
    run-groups:
      adaptive:
        args: |
          [{"R":32,"L":100,"build_threads":4,"batch_rows":4096}]
        query-args: |
          [{"threads":4,"search_l":200,"initial_candidates":256,"max_candidates":8192,"exact_cutoff":2048}]
  gsvector-filter-fast:
    docker-tag: vector-competition/gsvector-benchmark:release-20261026
    module: benchmark.algorithms.pg_filtered
    constructor: PGFilteredANN
    base-args: ["@metric"]
    run-groups:
      bounded-build:
        args: |
          [{"R":24,"L":64,"build_threads":8,"batch_rows":4096}]
        query-args: |
          [{"threads":4,"search_l":200,"initial_candidates":256,"max_candidates":8192,"exact_cutoff":2048}]
  gsvector-filter-bestfirst:
    docker-tag: vector-competition/gsvector-benchmark:release-20261026
    module: benchmark.algorithms.pg_filtered
    constructor: PGFilteredANN
    base-args: ["@metric"]
    run-groups:
      experimental-bestfirst-codeoff:
        args: |
          [{"R":24,"L":64,"build_threads":4,"batch_rows":4096,"min_run_rows":0,"build_beam_first":true,"build_neighbor_codes":false}]
        query-args: |
          [{"threads":4,"search_l":200,"initial_candidates":256,"max_candidates":8192,"exact_cutoff":2048}]
  gsvector-filter-resource-wide:
    docker-tag: vector-competition/gsvector-benchmark:release-20261026
    module: benchmark.algorithms.pg_filtered
    constructor: PGFilteredANN
    base-args:
    - '@metric'
    run-groups:
      adaptive:
        args: '[{"R": 32, "L": 100, "build_threads": 32, "batch_rows": 4096}]'
        query-args: '[{"threads": 32, "search_l": 200, "initial_candidates": 256, "max_candidates":
          8192, "exact_cutoff": 2048}]'
